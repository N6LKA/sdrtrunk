{% extends "base.html" %}
{% block content %}
<p><a href="{{ url_for('view_system', system_id=system['id']) }}">&larr; {{ system['label'] }}</a></p>
<h2>Edit System</h2>
<form method="post" action="{{ url_for('edit_system', system_id=system['id']) }}">
  <label>Protocol
    <select name="protocol" required>
      {% for p in ['P25', 'DMR', 'NXDN'] %}
      <option value="{{ p }}" {{ 'selected' if system['protocol'] == p }}>{{ p }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Label <input name="label" required value="{{ system['label'] }}"></label>
  <label>Identifier <input name="identifier" value="{{ system['identifier'] or '' }}" placeholder="P25: WACN/SYSID hex, DMR: network name, NXDN: RAN"></label>
  <label>Notes <textarea name="notes">{{ system['notes'] or '' }}</textarea></label>
  <button type="submit">Save Changes</button>
</form>

<form method="post" action="{{ url_for('delete_system', system_id=system['id']) }}"
      onsubmit="return confirm('Delete {{ system['label'] }} and all of its keys? This cannot be undone.');" style="margin-top: 2rem;">
  <button type="submit" style="color: #c33;">Delete System (and all its keys)</button>
</form>
{% endblock %}
