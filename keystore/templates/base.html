<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Radio Keystore{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
    th { background: #f4f4f4; }
    form.inline { display: inline; }
    .retired { color: #999; text-decoration: line-through; }
    fieldset { margin-bottom: 1.5rem; }
    label { display: block; margin-top: 0.5rem; }
    input, select, textarea { width: 100%; max-width: 400px; padding: 0.3rem; box-sizing: border-box; }
    button { margin-top: 0.75rem; padding: 0.4rem 1rem; }
    a { color: #06c; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('index') }}">Radio Keystore</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
